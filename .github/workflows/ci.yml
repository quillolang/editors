name: CI

on:
  push:
  pull_request:

jobs:
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      # The grammar test also tokenizes every example.
      - uses: actions/checkout@v4
        with:
          repository: quillolang/examples
          path: examples
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Grammar tests, then the package
        env:
          QUILLO_EXAMPLES: ${{ github.workspace }}/examples
        run: npm ci && npm test && npx vsce package

  jetbrains:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetbrains
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # No QUILLO_BIN here: the tests that need the server are skipped.
      - name: Tests, the plugin, and the Plugin Verifier on both ends of its range
        run: ./gradlew test buildPlugin verifyPluginStructure verifyPlugin

  tree-sitter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tree-sitter
    steps:
      - uses: actions/checkout@v4
      # The corpus test parses every example.
      - uses: actions/checkout@v4
        with:
          repository: quillolang/examples
          path: examples
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The grammar, its trees, highlights and queries, and the examples parsed
        env:
          QUILLO_CORPUS: ${{ github.workspace }}/examples
        run: npm ci && npm test
      - name: The committed parser is the grammar's
        run: git diff --exit-code src/

  zed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zed
    steps:
      - uses: actions/checkout@v4
        with:
          # The test looks for the grammar's commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: The extension's tests, and the build Zed makes
        run: cargo test && cargo build --release --target wasm32-wasip1

  neovim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neovim
    steps:
      - uses: actions/checkout@v4
      - name: LuaJIT, Neovim's Lua
        run: sudo apt-get install -y luajit
      - name: The plugin against a stand-in for Neovim's API
        run: luajit test/run.lua

  helix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helix
    steps:
      - uses: actions/checkout@v4
        with:
          # The test looks for the grammar's commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: languages.toml and the queries, against what Helix reads
        run: npm ci && npm test
